<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Enact">
  <!--
    The Enact mark in the colour variant: three cubes stacked in isometric
    projection, one green gradient per cube running top-left to bottom-right
    across that cube's own box, left and right faces darkened 18% and 36%.
    The ground is transparent so the tab icon sits on whatever the browser
    paints behind it, light or dark.
    Geometry and colours come from design-system/enact/MASTER.md §10 and
    packages/ui/components/common/enact-icon.tsx — edit there and keep in sync.
  -->
  <defs>
    <linearGradient id="enact-favicon-top" gradientUnits="userSpaceOnUse" x1="6.5" y1="2.375" x2="17.5" y2="13.375">
      <stop offset="0" stop-color="#c4d600"/>
      <stop offset="1" stop-color="#86bc25"/>
    </linearGradient>
    <linearGradient id="enact-favicon-left" gradientUnits="userSpaceOnUse" x1="1" y1="10.625" x2="12" y2="21.625">
      <stop offset="0" stop-color="#86bc25"/>
      <stop offset="1" stop-color="#26890d"/>
    </linearGradient>
    <linearGradient id="enact-favicon-right" gradientUnits="userSpaceOnUse" x1="12" y1="10.625" x2="23" y2="21.625">
      <stop offset="0" stop-color="#26890d"/>
      <stop offset="1" stop-color="#046a38"/>
    </linearGradient>
  </defs>
  <g transform="translate(16.182 16.182) scale(2.81818)">
    <path fill="url(#enact-favicon-top)" d="M12 2.375 L17.5 5.125 L12 7.875 L6.5 5.125 Z"/>
    <path fill="url(#enact-favicon-top)" d="M6.5 5.125 L12 7.875 L12 13.375 L6.5 10.625 Z"/>
    <path fill="url(#enact-favicon-top)" d="M12 7.875 L17.5 5.125 L17.5 10.625 L12 13.375 Z"/>
    <path fill="url(#enact-favicon-left)" d="M6.5 10.625 L12 13.375 L6.5 16.125 L1 13.375 Z"/>
    <path fill="url(#enact-favicon-left)" d="M1 13.375 L6.5 16.125 L6.5 21.625 L1 18.875 Z"/>
    <path fill="url(#enact-favicon-left)" d="M6.5 16.125 L12 13.375 L12 18.875 L6.5 21.625 Z"/>
    <path fill="url(#enact-favicon-right)" d="M17.5 10.625 L23 13.375 L17.5 16.125 L12 13.375 Z"/>
    <path fill="url(#enact-favicon-right)" d="M12 13.375 L17.5 16.125 L17.5 21.625 L12 18.875 Z"/>
    <path fill="url(#enact-favicon-right)" d="M17.5 16.125 L23 13.375 L23 18.875 L17.5 21.625 Z"/>
    <path fill="#000000" fill-opacity="0.18" d="M6.5 5.125 L12 7.875 L12 13.375 L6.5 10.625 Z"/>
    <path fill="#000000" fill-opacity="0.36" d="M12 7.875 L17.5 5.125 L17.5 10.625 L12 13.375 Z"/>
    <path fill="#000000" fill-opacity="0.18" d="M1 13.375 L6.5 16.125 L6.5 21.625 L1 18.875 Z"/>
    <path fill="#000000" fill-opacity="0.36" d="M6.5 16.125 L12 13.375 L12 18.875 L6.5 21.625 Z"/>
    <path fill="#000000" fill-opacity="0.18" d="M12 13.375 L17.5 16.125 L17.5 21.625 L12 18.875 Z"/>
    <path fill="#000000" fill-opacity="0.36" d="M17.5 16.125 L23 13.375 L23 18.875 L17.5 21.625 Z"/>
  </g>
</svg>

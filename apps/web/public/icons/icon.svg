<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Enact">
  <!--
    Full-bleed source for the generated home-screen icons (apple-touch-icon.png,
    icon-maskable-512.png). Full-bleed because both surfaces mask the artwork
    themselves: iOS rounds the corners, Android crops to the launcher shape.
    The mark is /favicon.svg's, inverted to the dark app-icon treatment the
    desktop and mobile builds already ship, and held at 52% of the canvas so it
    stays inside the maskable safe zone (the centre circle of 80% diameter).
    See app/manifest.ts for the regeneration commands.
  -->
  <rect width="512" height="512" fill="#111827"/>
  <path fill="#ffffff" fill-opacity="1" d="M12 2.375 L17.5 5.125 L12 7.875 L6.5 5.125 Z" transform="translate(110.778 110.778) scale(12.10182)"/>
  <path fill="#ffffff" fill-opacity="0.62" d="M6.5 5.125 L12 7.875 L12 13.375 L6.5 10.625 Z" transform="translate(110.778 110.778) scale(12.10182)"/>
  <path fill="#ffffff" fill-opacity="0.38" d="M12 7.875 L17.5 5.125 L17.5 10.625 L12 13.375 Z" transform="translate(110.778 110.778) scale(12.10182)"/>
  <path fill="#ffffff" fill-opacity="1" d="M6.5 10.625 L12 13.375 L6.5 16.125 L1 13.375 Z" transform="translate(110.778 110.778) scale(12.10182)"/>
  <path fill="#ffffff" fill-opacity="0.62" d="M1 13.375 L6.5 16.125 L6.5 21.625 L1 18.875 Z" transform="translate(110.778 110.778) scale(12.10182)"/>
  <path fill="#ffffff" fill-opacity="0.38" d="M6.5 16.125 L12 13.375 L12 18.875 L6.5 21.625 Z" transform="translate(110.778 110.778) scale(12.10182)"/>
  <path fill="#ffffff" fill-opacity="1" d="M17.5 10.625 L23 13.375 L17.5 16.125 L12 13.375 Z" transform="translate(110.778 110.778) scale(12.10182)"/>
  <path fill="#ffffff" fill-opacity="0.62" d="M12 13.375 L17.5 16.125 L17.5 21.625 L12 18.875 Z" transform="translate(110.778 110.778) scale(12.10182)"/>
  <path fill="#ffffff" fill-opacity="0.38" d="M17.5 16.125 L23 13.375 L23 18.875 L17.5 21.625 Z" transform="translate(110.778 110.778) scale(12.10182)"/>
</svg>

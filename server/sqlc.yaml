version: "2"
sql:
  - engine: "postgresql"
    queries: "pkg/db/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "db"
        out: "pkg/db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        # Keep the generated Go field idiomatic while retaining the explicit
        # product-qualified database column name.
        rename:
          enact_user_id: "EnactUserID"

# ontologizer.yaml —— 项目记录。由 state.py init 生成，这里是它的形状与含义。
# 手写这个文件不会把项目登记到本机清单，也不会建出目录树与决策日志：用 init。

slug: journal-reversal          # 项目短名。目录名可以不同，这个才是记录里用的身份
created_at: 2026-09-03T10:04:00+08:00   # init 写入，不要改
goal: 支持财务助手回答"一条分录能不能冲销、该谁批"   # 一句话业务目标
domain: 总账 · 日记账冲销        # 领域，用业务的说法，不用系统名
language: zh                     # 交付物与对话的主语言

owners:                          # 三个位置都要有人。空着后面每一步都不知道该找谁
  domain: FSSC 总账主管          # 领域专家 DE：证据是否足够由他拍板
  ontology: 数据平台组架构师      # 本体负责人 OO：多数决策点的最终责任人
  process: 月结流程 owner         # 流程负责人 PO：流程步骤、事件、生命周期由他确认

pins:                            # 版本基线。重开项目时靠它判断结果还能不能比
  spec_version: '0.2'            # 本包遵循的规格版本
  skill_pack_version: 0.1.0      # 技能包版本
  model: claude-opus-5           # 生成用的模型；未记录时写 unrecorded，不要编

workspace_version: 1             # 工作区布局版本，由本包维护

# Managed Change Area —— Build 的行为边界。
# 核心：可读范围宽（要理解全局），可写范围窄（让复核成为可能）。
# 编辑权限：越界时不修改本文件，而是生成 version+1 的新版本并配 gates/scope-expansion-###.yml。

version: 1
work_item: WI-000
based_on_contract_version: 1

# 声明这份范围时工作区所在的 revision（`git rev-parse HEAD`）。
# 为什么必须填：`vcs-commit` 是允许的动作，所以一次越界可以被 commit 掉——
# 工作区随之变干净，只看未提交 diff 的检查会报"无越界"。有了基线，
# check_scope.py 才能把"声明范围之后发生的一切"都看进来，无论提没提交。
# 留空时 check_scope.py 会照跑，但会明说它看不见已提交的部分。
base_revision: ""

# ---------------------------------------------------------------------------
# 本文件是 contract.boundary 的**物化**，不是一份独立的边界声明。
#
# Contract 说的是意图级："可以动报表模块，不能动共享数据模型"。
# 这里说的是文件级："具体动 src/reports/exporter.py 和 tests/reports/**"。
# check_scope.py 会校验 write ⊆ contract.boundary.may_change，
# 且没有任何一条落进 must_not_change——越界因此有两道防线。
#
# 推导不出来说明 Contract 的 boundary 写得太模糊，回 contract 环节补，
# 不要在这里自己扩大解释。
# ---------------------------------------------------------------------------
derived_from:
  may_change: []              # 从 contract.boundary.may_change 抄下来，逐条对应
  must_not_change: []         # 同上；下面的 protected 必须覆盖这些

# 低风险的 v1 可由 owner 默认接受；任何扩大版本必须人工确认。
approved_by: ""
approved_at: null

# ---------------------------------------------------------------------------
# read：允许查询理解的范围。可以宽——Agent 需要读懂现有模式、接口和约束
# 才能写出符合项目习惯的代码。读得多不危险，写得多才危险。
# ---------------------------------------------------------------------------
read:
  - "src/**"
  - "docs/**"
  - "tests/**"

# ---------------------------------------------------------------------------
# read_excluded：即使落在 read 内也不得读入上下文。默认继承 config.yaml 的
# data_policy.never_read。写保护不等于读保护——一个 .pem 即使在 protected 里，
# 按"可读范围宽"的原则仍然是可读的，必须靠这一项拦住。
#
# 命中时的动作：停止读取 → 记 boundary_stop → 说明缺什么、用什么替代
#（例如用 .env.example 的键名而非值）→ 不把内容带入上下文。
# ---------------------------------------------------------------------------
read_excluded:
  - "**/*.pem"
  - "**/.env"
  - "**/secrets*"

# ---------------------------------------------------------------------------
# write：本次允许修改或新建的具体路径。列到能让复核者知道该看哪里的粒度。
# 新建文件的落点也必须在这里面。
# ---------------------------------------------------------------------------
write: []
  # - "src/reports/exporter.py"
  # - "tests/reports/**"

# ---------------------------------------------------------------------------
# protected：明确不可改，即使看起来明显该改。
# 未显式列出的以下区域默认按 protected 处理：
#   共享接口 / 数据模型 / 基础设施配置 / 安全与密钥配置 / CI 配置
# 在保护区里发现 bug，记下来作为独立发现交出去——你不知道它是不是有意的。
# ---------------------------------------------------------------------------
# 两个来源要分开记：继承自 config.yaml 的项目级保护 vs 本次自己收紧的部分。
# check_scope.py 报违规时会指出来源层级——项目策略要找平台负责人改，
# 本次收紧找 WI owner 就行。不区分的话，用户不知道该向谁申诉。
protected_from_project:         # 继承，不要在这里删条目
  - "infra/**"
  - ".github/workflows/**"
protected_local: []             # 本次额外收紧

# ---------------------------------------------------------------------------
# tool_actions：允许的命令类别。forbidden 里的动作有 workspace 外副作用，
# 属于必须停下来找人的四类事之一。
# ---------------------------------------------------------------------------
tool_actions:
  # 必须是 contract.boundary.allowed_actions 的子集——可以收紧，不能放宽
  allowed: [lint, unit-test, build, vcs-commit]
  forbidden: [deploy, push, publish, network-write, db-migrate]
  environment: local            # 这些命令跑在哪：local | ci | staging
  credentials: none             # 本次可用的凭据集合。none = 不需要任何凭据

# ---------------------------------------------------------------------------
# escalation：什么情况必须停。这不是提醒，是 Build 的停止条件。
# ---------------------------------------------------------------------------
escalation:
  - 需要修改 protected 中的路径
  - 需要新增 write 白名单外的文件
  - 需要执行 forbidden 中的动作
  - 发现 Contract 缺口（转 amendments/）

# 扩大历史。追加不覆盖——审计需要知道范围是怎么一步步变宽的。
history: []
  # - version: 1
  #   at: 2026-08-21T09:00:00Z
  #   change: 初始范围
  #   approved_by: 张三

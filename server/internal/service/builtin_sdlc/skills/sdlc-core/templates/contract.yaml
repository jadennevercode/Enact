# Execution Contract —— 这项工作的唯一真相。
#
# 它覆盖业务与技术的全部声明：要达成什么、验收标准、技术方案、可动的边界、
# 发布与回退。Build 做什么、QA 测什么、Release 凭什么决定，都以这一份为准。
#
# 编辑权限：contract 环节拥有本文件。status=approved 之后不可变——
# 要改走 amendments/AMD-###.md 并产生新版本文件。
#
# 人类视图不手写。`review/contract.html` 由 render_review.py 从本文件生成，
# 按角色分标签页。两份手写的视图迟早会各自漂移成两份真相，所以只留一份手写。

version: 1
status: draft                 # draft | approved | superseded
# 只在 gates/contract-approval.yml 存在且有效（PASS + 具名 approved_by）时填。
approved_by: ""
approved_at: ""

# ===========================================================================
# 第一块　业务声明——要改变什么，怎么算做到了
# 主要读者：业务负责人、产品、QA
# ===========================================================================

# outcomes：要改变的业务结果，1-3 条。写"世界会有什么不同"，不写"系统会有什么功能"。
# 没有 outcome 的 requirement 通常是在做没人要的东西。
outcomes:
  - id: O1
    text: ""

# requirements：系统必须做到什么。每条至少关联一条 criteria——
# 没有验收标准的需求无法验证，等于没写。
requirements:
  - id: R1
    text: ""
    criteria: []              # ["1.1", "1.2"]

# ---------------------------------------------------------------------------
# criteria：验收标准。三条硬要求：EARS 语法、层级编号、可独立验证。
# 编号是全套件的连接坐标：build 的任务和 qa 的 Test Intent 都按它回溯引用。
#
# EARS 五模式：
#   系统 SHALL <行为>                                   （无条件）
#   WHEN <事件> THEN 系统 SHALL <响应>                   （事件驱动）
#   WHILE <状态> 系统 SHALL <行为>                       （状态持续）
#   WHERE <特性存在> 系统 SHALL <行为>                    （可选特性）
#   IF <异常前置> THEN 系统 SHALL <处理>                  （异常路径）
#
# ✅ WHEN 导出请求的时间范围超过 12 个月 THEN 系统 SHALL 拒绝并返回可读的错误说明
# ❌ 系统应该有良好的性能            （无法验证，也不是 EARS）
# ❌ 优化报表导出逻辑                （是任务，不是标准）
# ---------------------------------------------------------------------------
criteria:
  - id: "1.1"
    ears: ""
    verification: automated   # automated | manual
    verified_by: ""           # verification=manual 时必填具名责任人
    notes: ""

# scope：excluded 不是可选项。显式排除比隐含包含更能防止范围蔓延，
# 也让 Build 知道哪些"看起来该顺手做"的事情不该做。
scope:
  included: []
  excluded: []

# ===========================================================================
# 第二块　技术设计——打算怎么做，为什么这么做
# 主要读者：架构、开发
#
# 这一块此前是独立的 design.md。合进来的理由：两份手写视图会各自漂移成
# 两份真相，而主规格明确要求"两种视图不能各自编辑"。现在只有这一份手写，
# 人类视图由渲染器生成。
# ===========================================================================
design:
  # 一段话说清做法。让人读完知道大致会发生什么变化。
  approach: |
    

  # 流程与结构图。以下情况必须给图，纯文字说不清楚：
  #   多角色流转 / 状态迁移 / 跨服务调用 / 数据流向
  # 用 mermaid 语法；渲染器有网时画成图，离线时显示代码块。
  # 不需要图的写 "不适用：<一句理由>"。
  diagrams:
    - title: ""
      relates_to: []          # ["R1", "1.1"] —— 这张图在解释哪几条
      mermaid: |
        flowchart LR
          A[请求] --> B{条件}
          B -->|是| C[处理]
          B -->|否| D[拒绝]

  # 关键设计决定。记录被放弃的备选——三个月后有人问"为什么不用 X"时，
  # 这是唯一的答案来源。
  decisions:
    - id: TD1
      decision: ""
      chosen: ""
      alternatives_rejected: ""
      impact: ""              # 这个选择让什么变难或变贵
      revisit_at: ""          # 什么条件下该重新考虑；无则留空

  # 变更影响
  impact:
    interfaces: ""            # 破坏性变更？谁是消费方？迁移要求？
    data: ""                  # 结构变化、迁移、历史数据处理
    dependencies: ""          # 新增依赖、版本约束
    operations: ""            # 配置、监控、告警要跟着改什么

  # 非功能要求。写不出数值的写"未定 + 谁来定"，不要写"高性能"这种。
  nfr:
    performance: ""
    availability: ""
    security: ""
    capacity: ""

# ===========================================================================
# 第三块　变更边界——什么可以动，什么绝对不能动
# 主要读者：开发、架构
#
# 这里声明的是**意图级**边界（哪些模块/接口可动），不是文件清单——
# 契约阶段还猜不出文件名。Build 会把它物化成文件级的 change-scope.yaml，
# 并且 check_scope.py 会校验 change-scope ⊆ 这里声明的 boundary。
# 两层的意义：Contract 说"可以动报表模块"，Build 说"具体动这三个文件"，
# 越界因此有两道防线。
# ===========================================================================
boundary:
  # 本次工作预期会改动的模块、组件或子系统
  may_change:
    - ""                      # 例：报表导出模块（src/reports）

  # 明确不能动的，即使看起来该改。未列出的以下区域默认禁止：
  #   共享接口 / 数据模型 / 基础设施 / 安全与密钥配置 / CI 配置
  must_not_change:
    - ""                      # 例：Order/Refund 共享数据模型

  # 允许的动作类别。workspace 外的副作用（deploy/push/publish）默认禁止。
  allowed_actions: [lint, unit-test, build, vcs-commit]

  # 什么情况必须停下来找人。这不是提醒，是 Build 的停止条件。
  escalation:
    - 需要改动 must_not_change 中的任何一项
    - 需要执行 allowed_actions 之外的动作类别
    - 发现本 Contract 不完整或自相矛盾（转 Amendment）

# ===========================================================================
# 第四块　发布与运维声明——怎么发，出事怎么退，靠什么发现出事
# 主要读者：运维、Release Authority
#
# 这一块此前直到 Release 组装 Evidence Case 时才第一次出现——太晚了。
# "怎么回退"是设计问题不是发布问题：某些方案根本回不去，那应该在
# 契约阶段就影响技术选型，而不是发布前夜才发现。
# ===========================================================================
release:
  strategy: ""                # 一次性 / 灰度 / 开关控制 / 分批
  rollback: ""                # 怎么退。**退不回去的方案要在这里说明白**
  rollback_data_state: ""     # 退回后数据处于什么状态；有不可逆写入要点名
  monitoring: ""              # 发布后看什么指标、看多久
  support: ""                 # 异常时谁响应、走哪条升级路径

# ===========================================================================
# 横切　适用规则与未决问题
# ===========================================================================

# 适用的编码规范、安全策略、发布规则。指向项目内的具体文档，不复述内容。
policies: []

# ---------------------------------------------------------------------------
# open_decisions：需要人类判断的未决问题。
# Gate 规则：全部必须为 closed 或 accepted，contract 才能 approved。
# "文档写完"不等于"设计完成"——真正的完成标志是未决问题被处置。
# ---------------------------------------------------------------------------
open_decisions:
  - id: D1
    question: ""
    status: open              # open | closed | accepted（带风险接受）
    resolution: ""
    owner: ""
    deadline: ""              # 什么时候必须有答案
    # status=accepted 时必填：什么时候回来重新看这个决定。
    # 带风险接受的决定如果没有复查时点，就会变成"临时默认长期埋在系统里"——
    # 那正是主规格 D16 明确要防的事。
    revisit_at: ""

# ===========================================================================
# 角色视图：渲染器按这张表分标签页。
# 角色既是视图也是权限：这里决定谁看哪几块，config.yaml 的 gates.<name>.require
# 决定哪几个角色必须签。签署角色的视图合起来必须盖住下面每一块内容——
# 盖不住就有内容没人看过，coverage_stats.py --phase contract 会报出来。
# 角色名是受控词表：业务负责人 / 架构 / 开发 / QA / 运维，不能自造。
# 分视图的理由：合成一份不等于让一个人读完全部。
# ===========================================================================
role_views:
  业务负责人: [outcomes, requirements, criteria, scope, open_decisions]
  架构:       [design, boundary, policies, open_decisions]
  开发:       [criteria, design, boundary, policies]
  QA:         [criteria, scope, design.impact, release.rollback]
  运维:       [release, design.nfr, design.impact]

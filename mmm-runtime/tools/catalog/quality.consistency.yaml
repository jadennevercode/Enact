# tools/catalog/quality.consistency.yaml
id: quality.consistency
kind: quality
purpose: 一致性维度的三个子项——维度一致性、时间一致性、口径一致性，各打 0 / 0.5 / 1 分。
when: |
  数据质量评分 · 「按四个维度给指标打分」的第一步。
  四个维度各跑一次，四份结果再由 quality.scorecard 卷成总分。
  流程定义见 shared/manifests/deliverables.yaml。
inputs: []
output:
  path: data/derived/quality-consistency.json
  shape: |
    dimension        恒为 consistency
    signature        本次打分的行集指纹；卷积时四份必须一致，否则拒绝混着算
    rows[]           每个已打分的指标一项：
      id             行号，形如 q-0007，与另外三个维度、与评分表同号
      l1 · l2 · l3 · l4 · indicator   因子层级与指标名，来自因子树
      treeRowId      对应的因子树行号
      dataStatus     恒为 scored（没数据、上游已否的行不进这份结果）
      score          一致性维度分 = 该维度全部阻断型子项里最低的那个
      subScores[]    三个子项逐条：
        key          consistency.dimension / consistency.time / consistency.caliber
        label        中文名
        score        0 / 0.5 / 1
        note         这个分是怎么来的，带算出来的数
        computed     false 表示「没查」——缺对照输入，恒 1 分。视图上要渲染成「未校验」
        blocking     true 表示它能压住整个维度分；false 只带一句话
    skipped          {no-data: n, inherited-drop: n} 这次没打分的行数，按原因分
    orphanCount      数据里有、因子树没要过的指标数
stdout: |
  一致性：18 条序列打分 · 3 个 0.5 分 · 15 个 1 分
  未校验（缺对照输入，恒 1 分且不阻断）：维度一致性
    视图上这几项必须渲染成「未校验」。没查和查了没问题不能长得一样。

  扣分的行，最差在前：
    0.5  试饮                       执行门店数              数据源发生变化，但前后同比变动 12%（≤30%）。
example: ~/.local/bin/mmm tool quality.consistency --workspace <工作区>
notes: |
  三个子项各自问一件不同的事：
    维度一致性  同一个指标是不是在同一个单位、同一套定义上报的。
                需要长表的 unit 列；没有这一列时它 computed=false、恒 1 分、不阻断，
                并明确报成「未校验」——现在它显示 1 分，读起来像通过了，实际是没查。
                长表补上 unit 之后它自动变成可计算且阻断，判据不用改。
                数据的主单位与因子树声明的 unit 不一致，算 100% 不一致：
                每一行都在错的口径上，只是它们彼此一致而已。
    时间一致性  时间粒度是不是统一，以及够不够细。粗于月度直接 0 分。
    口径一致性  数据源有没有中途换过。判的是「换过源」而不是「多源混合」——
                稳定的多源混合不算口径变化，一个源出现或消失才算。
                换源之后再看前后同比：>30% 是断裂，≤30% 是重新打标。
  不做任何预先汇总。按全国口径先汇总再打分，会让 source 被改写成一个常量，
  口径变化就再也看不见——要对已发布的行打分。

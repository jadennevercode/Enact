# tools/catalog/ols.scorecard.yaml
id: ols.scorecard
kind: model
purpose: 把每个拟合出来的因子跟它的行业区间对一遍，逐条给出接受还是否掉的建议，并保住人已经下过的判定。
when: |
  OLS 预验证 · 「逐因子对照行业区间判读」，产出供人逐条裁决的那张表。
  每次重拟合之后都可以重跑；人的判定不会被覆盖。
  流程定义见 shared/manifests/deliverables.yaml。
inputs: []
output:
  path: artifacts/s2/ols-scorecard.yaml
  shape: |
    meta                   说明这份产物是谁在哪一步生成的（task · skill · mode ·
                           generated · grounding[] · knowledgeRecall）
    rows[]                 每个「模型对象 × 因子」一项：
      id                   行编号，形如 <模型对象>|<l4>|<指标>
      object               模型对象
      treeRowId            对应的因子行编号
      l1 · l2 · l3 · l4    因子层级
      indicator            因子树里的指标名
      metric               数据侧的指标名
      coef                 回归系数
      tValue · pValue      检验统计量与显著性
      significant          是否显著
      roi                  投资回报
      contribution         贡献度
      roiRange             行业投资回报区间
      contributionRange    行业贡献度区间
      roiStatus            投资回报对区间的状态；"none" 表示这个行业根本没有基准
      contributionStatus   贡献度对区间的状态
      rangeSource          区间取自哪份行业材料
      roiDeviationPct      越界时偏离带沿的百分比；带内为 0；没有带时为 null
      contributionDeviationPct  同上，对贡献度
      rangeSeverity        红黄绿灯：none 没有带 / green 带内 /
                           yellow 偏离 < 30%（进裁决，推荐保留）/
                           red 偏离 ≥ 30%（推荐否决，并提示回流业务校验重审假设）
      status               这一行在拟合里的状态
      flagReason           被标记的原因
      aiVerdict            AI 的判读
      aiRationale          AI 的理由
      autoVerdict          自动建议：accept / reject
      autoReason           自动建议的依据
      disposition          最终处置：accept / reject
      decidedBy            "ai" 表示还是自动值，"human" 表示人已经定过、会被钉住
      note                 人写的备注
    reason                 仅当一条都没有时出现，说明原因
stdout: |
  22 fitted factor(s) · 5 rejected · 3 pinned by a human

  out of band, worst first:
    电商            电商投放                 直播花费           got 8.412, band 1.5-4.0

  4 factor(s) have NO benchmark for this industry.
example: ~/.local/bin/mmm tool ols.scorecard --workspace <工作区>
notes: |
  这是一张会被保存下来的表，不是每次现算的——正因为如此，人的判定才能扛过重拟合：
  计算字段和 AI 的建议每次都重算并展示出来，但 decidedBy 为 "human" 的那一行，
  它的处置和备注原样保留。
  新的拟合结果里没有的行不会消失：处置为 reject 的旧行会被搬过来，
  否则一次否决会在下一次保存时凭空蒸发（被否掉的指标本来就不会再进拟合，所以它不可能出现在新结果里）。
  没有基准的因子要单独看待：那是「这项检查没跑」，不是「超出区间」。
  越界不是一个二值判断：1.35 对 0.8~1.3 和 13 对同一条带要的动作是相反的，
  前者多半是区间过时，后者几乎总是单位或分母出了问题。所以偏离 < 30% 只建议复核，
  ≥ 30% 才建议否决并提示回流业务校验重审假设。
  这一层的处置是二选一，没有中间态——它是进主数据表前的最后一层，
  留一个中间态就等于一个变量带着没人说过「可以」的身份走进模型。
  ⚠️ 流程定义里「逐因子对照行业区间判读」把 artifacts/s2/ols-scorecard.yaml 列在产出里，
  但那是人担责的步骤、没有声明 computed_by，没写清这份文件由这个工具刷新。

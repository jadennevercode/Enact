# tools/catalog/report.interview-insights.yaml
id: report.interview-insights
kind: report
purpose: 把访谈洞察与关键假设合成一份 Word —— 这几场访谈发现了什么，以及建模时哪些设定还没人背书。
when: |
  访谈 · 「从纪要里提洞察与关键假设」，在 insights.yaml 与 assumptions.yaml 写好之后、
  交验收之前。这一步是可选能力。流程定义见 shared/manifests/deliverables.yaml。
inputs:
  - path: artifacts/s1/interview/insights.yaml
    why: 洞察正文；指纹也跟着它算
  - path: artifacts/s1/interview/assumptions.yaml
    why: 关键假设那一节
output:
  path: artifacts/s1/interview/insights.docx
  shape: |
    一 洞察        每条：标题（缺口 / 矛盾）· 发现 · 证据锚点（≥2）· 建议 · 落在哪
                  末尾单列「已看过并决定不处理」的那些，带不处理的理由
    二 关键假设     表：编号 · 主题 · 问题 · 回答 · 出处 · 影响哪个建模决策
                  访谈没问到的会单独点出来——它们建模时会取默认值
    这份文档的来源
    文档属性里带 sourceHash，指向生成时那一版 insights.yaml。
run: |
  ~/.local/bin/mmm app report interview-insights --workspace <工作区>
requires: |
  Node 与 docx 这个包。缺了会直接报错说清楚怎么装，不会降级成 Markdown。
  `~/.local/bin/mmm doctor` 会报这台机器缺什么。
notes: |
  两份源文件合成一份 Word，因为它们回答的是同一个问题的两半：洞察说「这里有个缺口」，
  关键假设说「这个设定没人背书」。

  **指纹跟着 insights.yaml 走。** assumptions.yaml 改了而洞察没改时，这份 Word 不会被
  判过期——这是个已知的取舍：两份源文件由同一步产出、同一次生成，实际不会分叉。

  这个工具不替谁把一条洞察标成「已忽略」。忽略是人的决定，这里只负责印出来。

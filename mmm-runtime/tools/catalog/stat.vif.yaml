# tools/catalog/stat.vif.yaml
id: stat.vif
kind: statistical
purpose: 共线性检验——每个指标对着一个现实宽度的设计矩阵算方差膨胀因子，按 0 / 0.5 / 1 分档。
when: |
  统计检验 · 「按波动性、相关性、共线性筛查」的第三项。
  **必须在 stat.pearson 之后跑**：设计矩阵取的是与响应最相关的那 12 条。
  流程定义见 shared/manifests/deliverables.yaml。
inputs: []
output:
  path: data/derived/stat-collinearity.json
  shape: |
    test               恒为 vif
    signature          行集指纹；卷积时三份必须一致
    panel · months     面板规模与月份数
    vifDesign          对着多宽的设计矩阵算，例 "each against a 12-driver design"
    vifRegime          exact 精确值 / pairwise-proxy 两两近似值
                       —— 变量数 ≥ 观测数时完整的多元共线性指标不存在，报的是近似值，
                       产出必须直说这一点
    severeVif          严重共线性线，恒为 10.0
    rows[]             每个已检验的指标一项：
      id · l1 · l2 · l3 · l4 · indicator · treeRowId · dataStatus
      vif              方差膨胀因子，4 位
      severeCollinearity  VIF ≥ 10。为 true 时一律建议剔除，不论总分多高
      months           这个指标实际被观测到的月份数
    skipped            {no-data: n, inherited-drop: n}
    orphanCount        数据里有、因子树没要过的指标数
stdout: |
  共线性：17 条序列 · 1 个 0 分 · 10 个 0.5 分 · 6 个 1 分
  设计矩阵：each against a 12-driver design（与建模驱动数上限同源）

  2 条严重共线（VIF ≥ 10）——一律建议剔除，不论总分多高：
    41.203     门店数                      门店数量
    共线性说的是「这一组」：拿掉一个，其余每一个的值都会变。成组定，不逐行定。
example: ~/.local/bin/mmm tool stat.vif --workspace <工作区>
notes: |
  **注意方向：VIF = 1（无共线）是好的那一端，得 1 分；VIF ≥ 5 是明显共线，得 0 分。**
  分档：VIF ≥ 5 → 0；1 < VIF < 5 → 0.5；VIF ≤ 1 → 1。
  取值下限 1.0，上限 1000.0。

  **它读 stat.pearson 的结果，这不是偷懒。** 设计矩阵是「与响应最相关的 12 条」，
  所以这项检验真的依赖上一项。把相关性传进来，依赖就写在明面上，也不会在共线性内部
  藏第二次、可能不一样的 Pearson 运算。相关性结果的行集指纹对不上时判失败：
  用旧的相关性挑设计矩阵，算出来的共线性对着一个并不存在的模型。

  **对着什么算，是这一层最贵的一个坑。** VIF 是设计矩阵的属性：这一列的方差被
  **模型里的其他列**顶高了多少。对着全部候选一起问，两种情形都失败，而且是同一个根因——
  现实中不存在一个把上百条共季节的营销序列放在一起的模型。
  短面板落进两两最大代理，几乎每条序列都有某个同伴相关到 0.89 以上；
  长面板去求逆一个远非正定的相关矩阵，于是每个值都顶到上限。
  两条路的结果一样：几乎所有指标共线性 ≥ 5，总分归零，**约九成指标被筛掉**。
  所以每个指标对着它**可能真的进得去的那个模型**来量：与响应相关性最强的 12 条构成设计矩阵；
  不在这个集合里的指标，用最强的 11 条同伴加上它自己来量。
  **分档不变、算法不变，只有喂进去的矩阵变了。**

  缺口按**两两完整**处理：每对列在两者都覆盖的月份上算相关。用整体相关会让一个 NaN
  污染整个矩阵；把 NaN 先填零则读成「什么都不相关」，给每个指标发一个完美的 1.0。

  **VIF ≥ 10 单独标一个严重共线性。** 乘法标度表达不了它：共线性 5 和 50 都是 0 分，
  一个总分只能归零一次。

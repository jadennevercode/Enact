# 饮料行业的 L3/L4 与候选指标 —— 因子树推导的行业起底。
#
# 这个文件里没有一个 ROI / 贡献数字。数字在同目录的 factor-ranges.json，因为它们
# 属于一次具体交付（Danone Mizone），而结构属于这个行业。一份规则只有一个权威形态：
# 结构问这里，数字问那里，两边不重复。
#
# 目录即隔离：只有 industry 锚点是 food-bev/beverage 的工作区读得到本文件。
# 护肤项目读不到——这是构造，不是策略。
#
# 每行带 `aggregation`：这个指标往上滚（周→月、省→大区）的时候怎么合并。它是指标
# 本身的属性，不是某个项目的选择，所以它属于这里而不是每个项目各填一遍。判断标准
# 只有一句：把两行加起来还有没有业务含义——有就 sum，没有就 average。
# 对铺货率、份额、指数求和会造出一个没有意义的数，而模型拟合的就是那个数。
#
# 几行带 `aggNote`：口径决定归属，名字不决定。"已投放冰柜个数"记的是期末存量就
# average，记的是当期新增就 sum——这类行把两种口径都写在备注里，项目按客户实际报
# 数的口径覆盖它。

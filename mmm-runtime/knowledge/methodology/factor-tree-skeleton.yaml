# 因子树的 L1/L2 骨架 —— 跨行业锁定层。
#
# 为什么它不在行业包里：L1/L2 是全行业共用的一层（平台 00 §9「L1/L2 跨包共享，
# L3/L4+指标按包加载」，实盘宽表把 Level 1/Level 2 两列的出处标注为「行业通用」）。
# 放进 food-bev/beverage/ 会让它被目录锚定挡在护肤、医药项目门外，而那两个项目
# 同样需要这四个 L1 才能开工。
#
# 它的来源只有一处：Danone Mizone 那次交付的 94 行因子树。所以它是"目前唯一有
# 实盘背书的骨架"，不是"经过多行业验证的标准"。第二个行业进来时，这里要么被证实，
# 要么长出分支——两种结果都要走 promote 通道，不要就地改。
#
# 两个 L2 的名字里带 "/"（品牌广告/内容种草、渠道/终端营销）。那是行业惯例选定的
# 一个类目名，不是两个类目挤在一格里——照抄，不要"顺手拆开"。
id: factor-tree-skeleton
kind: skeleton
scope: all
version: 1
source: "AgenticMMM0612 V2/backend/data/templates/_index.json :: tpl-bev-factor-tree（94 行）"
provenance:
  project: "Danone Mizone"
  kind: case
  packs: 1
  note: "单一项目来源；未被第二个项目独立确认"
levels:
  l1: "生意的一级驱动分区，全行业一致"
  l2: "一级分区下的手段族，全行业一致"
  l3: "一起动、一起规划的一族东西 —— 数据需求的一册工作簿"
  l4: "这一族里的一个具体杠杆或条件 —— 工作簿里的一张表，也是模型变量的挂载点"
  indicator: "L4 怎么被量化；一个 L4 可以有多个候选，只能有一个主指标"
counts: { l1: 4, l2: 8 }
pairs:
  - { l1: "生意基本盘", l2: "外部因素" }
  - { l1: "生意基本盘", l2: "内部因素" }
  - { l1: "消费者需求驱动", l2: "品牌广告/内容种草" }
  - { l1: "渠道成交驱动", l2: "铺货" }
  - { l1: "渠道成交驱动", l2: "渠道执行及运营" }
  - { l1: "渠道成交驱动", l2: "渠道/终端营销" }
  - { l1: "渠道成交驱动", l2: "电商平台媒体及促销" }
  - { l1: "促销优惠", l2: "促销优惠" }
rules:
  - "推导（AI 那一步）只能在已有的 L1/L2 下面长 L3/L4，不新增这两层"
  - "人可以改 L1/L2，但要先被告知代价（数据需求分册重排、跨项目不可比、已作数的判断要重看），改了要记清楚是谁在什么时候因为什么改的，并把新骨架同步回知识包"
  - "L1/L2 的名字照抄，带 '/' 的类目名是一个名字不是两个"

# 一个数据源的登记卡 —— 落 data/clean/<数据源>/asset.yaml。
#
# 一次真实交付会拆出几十个数据源。这份卡回答的是
# 「这个口径当初是谁拍的、改过几轮、为什么改」。
id: ""                            # 数据源编号，与目录名一致
name: ""                          # 人话名字，例："Media 花费明细"
delivery: ""                      # 来自哪一批交付，例："2026-03-14-media"
sourceSystem: ""                  # 数据库直取 / 线下表格 / 客户手工表
sourceFiles: []                   # 这个数据源用到的原始文件与表页
owner: ""                         # 客户侧的数据对接人
priority: 0                       # 先做哪个；只是排期，没有别的含义

status: draft                     # draft | cleaned | conformed | published | refused

# 口径的多轮迭代。清洗脚本的每一次实质改动记一条，不要覆盖上一条。
# 这是「这批交付是怎么被解读的」的时间线。
log:
  - at: ""                        # 时间，带时区
    by: ""                        # 谁改的
    change: ""                    # 改了什么
    why: ""                       # 为什么改（客户澄清 / 违规值 / 对账不平 / …）

# 对账的数值基准列。**必须填**——不填就是没对账。
# 源表是多值宽表时，写清楚按哪几列求和作为基准，以及这是谁定的。
reconcile:
  rawValueColumn: ""
  basisNote: ""

notes: ""                         # 空结果、整列全空、解析失败之类的发现，写在这里

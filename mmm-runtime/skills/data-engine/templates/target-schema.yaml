# 目标表结构 —— 照这份填，不要自创结构。
# 落 metadata/schema/target-schema.yaml。写法见 ../references/schema.md。
#
# 这份文件在数据到达之前写完。看过数据之后才写的结构不可能失败，
# 不可能失败的检查是装饰。
version: 2

grain:
  time: month                     # 抄自项目档案的时间颗粒度，不在这里改
  keys:                           # 一行的身份。重复即意味着映射把行放大了
    - brand
    - channel_type
    - province_group
    - l1
    - l2
    - l3
    - l4
    - metric
    - month

# 19 列，顺序固定，不增不减：
#   task_name, brand, province_group, channel_type, channel, year, month, source,
#   l1..l8, metric_type, metric, value
# 必填：brand, year, month, l1, l2, l3, l4, metric_type, metric, value
columns:
  - name: channel_type
    label: 渠道类型
    kind: dimension               # dimension | time | factor | metric | value
    type: text                    # time→integer · value→number · 其余→text
    required: false
    enum: channel_type            # 指向 enums/channel_type.yaml
    nullMeans: national           # 仅渠道类型：空 = 全国，不是缺失
    definition: "客户的一级渠道分类，用于拆分模型对象"

  - name: metric_type
    label: 指标角色
    kind: metric
    type: text
    required: true
    enum: metric_type             # Y | spending | X，三选一，没有第四种
    definition: "这条序列在模型里的身份"

  - name: value
    label: 数值
    kind: value
    type: number
    required: true
    definition: "这条序列在这一格上的取值"

  - name: source
    label: 数据来源
    kind: dimension
    type: text
    required: true
    system: true                  # 系统列，掉了会被自动补回
    definition: "这一行来自哪一份交付"

  # …其余各列照此逐条写。每一列都要有 definition：它是三个月后
  # 唯一能回答「这一列当初指的是什么」的东西。

# 客户过目的记录 —— 照这份填，不要自创结构。填法见 ../references/signoff.md。
#
# **这一关只记客户明确否掉的指标。** 他没提到的按认可算。
#
# 这是一条记录在案的规则，不是疏漏：图册上有几十条指标，逼客户对每一条逐个表态，
# 换来的是一屏被批量点成"是"的按钮，而"有人真的看过"和"没人反对"之间唯一的区别信号
# 就此消失。所以这里只写他真的说了"不"的那些，并且要求这次会评本身有人、有时间——
# 否则"没人看过"和"大家都同意"会是同一份文件。

session: ""                          # 哪一次会评，例："数据会评 · 2026-03-20"
signedBy: ""                         # 谁过的目，带角色，例："客户 · 数字营销负责人"
signedAt: ""                         # 什么时候，带时区

# ── 客户否掉的指标 ────────────────────────────────────────────────
# 键 = "<L4>|<指标>"，与台账的键空间一致。
# **值必须加引号。** 不加引号的 no 会被读成布尔值，然后这个指标照样进模型。
# 一条都没否就写 signoffs: {} —— 空是一个合法且常见的答案。
#
# 每一条 "no" 都会被核对：对不上图册上真展示过的指标就判失败。打错字的否决什么都
# 否不掉，而且不核对的话没有任何东西会报错。
signoffs: {}
#  "抖音|抖音花费": "no"
#  "TV|GRP": "no"

# ── 逐条的理由 ────────────────────────────────────────────────────
# 只给否掉的写。客户当时怎么说的就怎么记，不要改写成分析语言。
denials:
  - key: ""                          # 与上面的键一致
    said: ""                         # 客户原话，例："这个口径我们内部早就不看了"
    raisedBy: ""                     # 谁说的
    consequence: ""                  # 例："统计检验、OLS 预验证、模型输入都不再用它"

# ── 会上问到、但当场答不了的 ──────────────────────────────────────
# 不阻断这一关，但必须带着负责人进下一次会评。口径类的问题（含不含折扣、SKU 怎么
# 定义、批发数据怎么拿）闭环之后回写到项目的口径备忘。
questions:
  - from: ""                         # 谁问的
    question: ""
    owner: ""                        # 负责人 / 部门
    reply: ""                        # 回复；还没回就写"待回"
    status: ""                       # 数据已查 | 已更新 | 待回

# ── 因子级预警 ────────────────────────────────────────────────────
# 某个 L4 的全部指标都被否 → 这个因子在模型里将没有任何东西代表它。
# 这不是提示，是要回业务理解找替代指标的信号。
factorAlerts:
  - l4: ""
    indicators: []
    reason: "全部候选指标被客户否决"
    action: "回流业务理解，寻找替代指标"

# ── 异常裁定的落点 ────────────────────────────────────────────────
# 裁定本身写在 anomalies.yaml 的每张卡上（status / handling / start / end）。
# 这里只记是在哪一场会上定的，方便半年后回查。
anomaliesDecidedAt: ""               # 例："数据会评 · 2026-03-20"

# ── 澄清登记 ──────────────────────────────────────────────────────
assumptions:
  - question: ""
    answer: ""
    decidedBy: ""
    at: ""
    assumed: false                   # true 表示没问到人，按推荐项走的
